name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 mpv libsdl2-2.0-0 ffmpeg desktop-file-utils
      - name: Check CLI without graphics dependencies
        run: /usr/bin/python3 -S main.py --version
      - name: Run gameplay, rendering, and installation tests
        run: /usr/bin/python3 tools/test.py
      - name: Validate shell scripts and desktop entry
        run: |
          bash -n install.sh packaging/arch/PKGBUILD packaging/arch/omacontra.sh
          desktop-file-validate packaging/arch/omacontra.desktop
      - name: Build runtime archive
        run: /usr/bin/python3 tools/build_release.py
      - name: Verify release archive matches installer pin
        # Development commits intentionally differ from the published download.
        # PRs still build the complete archive and run inventory/pin unit tests.
        if: startsWith(github.ref, 'refs/tags/v')
        run: /usr/bin/python3 tools/check_release.py
