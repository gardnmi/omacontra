<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Omacontra</title>
  </head>
  <body>
    <main>
      <canvas
        id="game"
        width="1280"
        height="720"
        tabindex="0"
        aria-label="Omacontra game. Arrow keys or WASD to move, Space to jump, Shift to dash, mouse to aim and fire, Escape to pause."
      ></canvas>
      <section id="gate">
        <h1>OMACONTRA</h1>
        <p id="loading" role="status">Loading…</p>
        <button id="play" hidden>PLAY</button>
      </section>
    </main>
    <footer>
      <span
        >Move: A/D / arrows · Jump: Space · Dash: Shift · Aim / fire: mouse ·
        Pause: Esc</span
      ><button id="fullscreen">Fullscreen</button>
    </footer>
    <script type="module" src="/src/campaign/main.ts"></script>
  </body>
</html>
